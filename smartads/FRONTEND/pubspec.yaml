name: smartads
description: SMARTADS billboard advertising app
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^8.1.7
  http: ^1.6.0
  video_player: ^2.11.1
  video_player_media_kit: ^2.0.0
  media_kit_libs_linux: any
  media_kit_libs_windows_video: any
  qr_flutter: ^4.1.0
  web_socket_channel: ^3.0.3
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  mobile_scanner: ^7.4.2
  crypto: ^3.0.6
  geolocator: ^14.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
